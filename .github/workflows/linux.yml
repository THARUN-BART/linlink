name: Build Linux

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]

jobs:
  build-linux:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Release Binary
        run: |
          cd linux-companion
          cargo build --release --locked

      - name: Package Linux Tarball
        run: |
          cd linux-companion
          mkdir -p release

          cp target/release/linlink release/

          if [ -f README.md ]; then
            cp README.md release/
          fi

          if [ -f LICENSE ]; then
            cp LICENSE release/
          fi

          tar -czf ../linlink-linux-x86_64.tar.gz -C release .

      - name: Upload Linux Tarball
        uses: actions/upload-artifact@v4
        with:
          name: linlink-linux-x86_64
          path: linlink-linux-x86_64.tar.gz
